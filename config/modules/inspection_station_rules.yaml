























module_id: inspection_station
scope: "Inspection Station"
default_source: "System"

rules:


  - node_id: BG56
    from_value: false
    to_value: true
    source: "System"
    text: "BG56 detects a workpiece at the infeed of conveyor C1."

  - node_id: BG56
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG56."


  - node_id: BG51
    from_value: false
    to_value: true
    source: "System"
    text: "BG51 detects a workpiece at the holder H2 on conveyor C1."

  - node_id: BG51
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG51."


  - node_id: TF81
    from_value: false
    to_value: true
    source: "System"
    text: "TF81 RFID sensor detects a workpiece at holder H2 on conveyor C1."

  - node_id: TF81
    from_value: true
    to_value: false
    source: "System"
    text: "TF81 RFID sensor no longer detects a workpiece."




  - node_id: rfid_read_complete
    from_value: false
    to_value: true
    source: "System"
    text: "The workpiece information is successfully retrieved."

  - node_id: rfid_read_complete
    from_value: true
    to_value: false
    source: "System"
    text: "RFID read state reset."


  - node_id: BG57
    from_value: false
    to_value: true
    source: "System"
    text: "BG57 detects a workpiece at the end of conveyor C1."

  - node_id: BG57
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG57."


  - node_id: BG26
    from_value: false
    to_value: true
    source: "System"
    text: "BG26 detects a workpiece at the end of conveyor C2."

  - node_id: BG26
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG26."


  - node_id: BG21
    from_value: false
    to_value: true
    source: "System"
    text: "BG21 detects a workpiece at the holder H1 on conveyor C2."

  - node_id: BG21
    from_value: true
    to_value: false
    source: "System"
    text: "BG21 no longer detects the workpiece."


  - node_id: BG27
    from_value: false
    to_value: true
    source: "System"
    text: "BG27 detects a workpiece near the storage station entrance on conveyor C2."

  - node_id: BG27
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG27."


  - node_id: BG41
    from_value: false
    to_value: true
    source: "System"
    text: "BG41 detects a workpiece before holder H3 on conveyor C3."

  - node_id: BG41
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG41."


  - node_id: BG42
    from_value: false
    to_value: true
    source: "System"
    text: "BG42 detects a workpiece on conveyor C4."

  - node_id: BG42
    from_value: true
    to_value: false
    source: "System"
    text: "A workpiece passes BG42."


  - node_id: C1_running
    from_value: false
    to_value: true
    source: "System"
    text: "Conveyor C1 starts running."

  - node_id: C1_running
    from_value: true
    to_value: false
    source: "System"
    text: "Conveyor C1 stops."

  - node_id: C2_running
    from_value: false
    to_value: true
    source: "System"
    text: "Conveyor C2 starts running."

  - node_id: C2_running
    from_value: true
    to_value: false
    source: "System"
    text: "Conveyor C2 stops."

  - node_id: C3_running
    from_value: false
    to_value: true
    source: "System"
    text: "Conveyor C3 starts running."

  - node_id: C3_running
    from_value: true
    to_value: false
    source: "System"
    text: "Conveyor C3 stops."

  - node_id: C4_running
    from_value: false
    to_value: true
    source: "System"
    text: "Conveyor C4 starts running."

  - node_id: C4_running
    from_value: true
    to_value: false
    source: "System"
    text: "Conveyor C4 stops."





  - node_id: C1_direction
    from_value: "reverse"
    to_value: "forward"
    source: "System"
    text: "Conveyor C1 direction set to forward."

  - node_id: C1_direction
    from_value: "forward"
    to_value: "reverse"
    source: "System"
    text: "Conveyor C1 direction set to reverse."

  - node_id: C2_direction
    from_value: "reverse"
    to_value: "forward"
    source: "System"
    text: "Conveyor C2 direction set to forward."

  - node_id: C2_direction
    from_value: "forward"
    to_value: "reverse"
    source: "System"
    text: "Conveyor C2 direction set to reverse."

  - node_id: C3_direction
    from_value: "reverse"
    to_value: "forward"
    source: "System"
    text: "Conveyor C3 direction set to forward."

  - node_id: C3_direction
    from_value: "forward"
    to_value: "reverse"
    source: "System"
    text: "Conveyor C3 direction set to reverse."

  - node_id: C4_direction
    from_value: "reverse"
    to_value: "forward"
    source: "System"
    text: "Conveyor C4 direction set to forward."

  - node_id: C4_direction
    from_value: "forward"
    to_value: "reverse"
    source: "System"
    text: "Conveyor C4 direction set to reverse."


  - node_id: H1
    from_value: true
    to_value: false
    source: "System"
    text: "Holder H1 is released."

  - node_id: H1
    from_value: false
    to_value: true
    source: "System"
    text: "Holder H1 returns to holding position."

  - node_id: H2
    from_value: true
    to_value: false
    source: "System"
    text: "Holder H2 is released."

  - node_id: H2
    from_value: false
    to_value: true
    source: "System"
    text: "Holder H2 returns to holding position."

  - node_id: H3
    from_value: true
    to_value: false
    source: "System"
    text: "Holder H3 is released."

  - node_id: H3
    from_value: false
    to_value: true
    source: "System"
    text: "Holder H3 returns to holding position."


  - node_id: S1
    from_value: "continue"
    to_value: "divert"
    source: "System"
    text: "Switch S1 is set to divert the workpiece to conveyor C4."

  - node_id: S1
    from_value: "divert"
    to_value: "continue"
    source: "System"
    text: "Switch S1 returns to continue path on conveyor C2."





  - node_id: robot_docked
    from_value: false
    to_value: true
    source: "System"
    text: "The transport robot has docked with the Inspection Station."

  - node_id: robot_docked
    from_value: true
    to_value: false
    source: "System"
    text: "The transport robot has departed from the Inspection Station."





  - node_id: inspection_complete
    from_value: false
    to_value: true
    source: "System"
    text: "The inspection service is successfully completed."

  - node_id: inspection_complete
    from_value: true
    to_value: false
    source: "System"
    text: "Inspection service state reset."




  - node_id: emergency_stop_active
    from_value: false
    to_value: true
    source: "System"
    text: "Emergency stop activated. All machine activity halted."

  - node_id: emergency_stop_active
    from_value: true
    to_value: false
    source: "System"
    text: "Emergency stop cleared. System ready to resume."
