[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm4ias"
version = "0.1.0"
description = "LLM-Controlled Industrial Automation System — backend implementation of Xia et al. (IEEE ETFA 2025)"
requires-python = ">=3.12"
dependencies = [

    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",


    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",


    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",


    "google-genai>=0.8.0",
    "tenacity>=8.3.0",


    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "core*",
    "db*",
    "schemas*",
    "digital_twin*",
    "llm*",
    "agents*",
    "command*",
    "dataset*",
    "evaluation*",
    "api*",
    "scripts*",
]
